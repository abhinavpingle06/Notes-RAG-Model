version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: Notes_Rag_Frontend
    ports:
      - "80:80"
    
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: npm run express
    container_name: Notes_Rag_Backend
    ports:
      - "3000:3000"
    depends_on:
      - redis
      
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: npm run worker
    container_name: Notes_Rag_Worker
    depends_on:
      - redis

  aiservice:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: Notes_Rag_AiService
    ports:
      - "8000:8000"
    depends_on:
      - redis

  redis:
    image: redis/redis-stack:latest
    container_name: Notes_Rag_Redis
    ports:
      - "6379:6379"   # Redis server
      - "8001:8001"   # RedisInsight UI